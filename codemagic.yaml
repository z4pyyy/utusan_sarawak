workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    environment:
      xcode: latest
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.utusanSarawak
      groups:
        - app_store_credentials
        - firebase_env
    scripts:
      - name: Write .env file
        script: |
          echo "$ENV_FILE_CONTENT" > "$CM_BUILD_DIR/.env"
      - name: Write GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS IPA
        script: |
          flutter build ipa --release --build-number=$BUILD_NUMBER
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key_id: $APP_STORE_CONNECT_KEY_ID
        api_issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        submit_to_testflight: true
